service:
  name: smart-data-service
  environment: development
  timezone: Asia/Shanghai
  host: 0.0.0.0
  port: 8080
  cors_origins:
    - "*"

mysql:
  dsn: mysql+pymysql://user:password@127.0.0.1:3306/gt_health
  pool_size: 10
  max_overflow: 10

influxdb:
  host: http://127.0.0.1:8181
  database: szt_flux
  token: token_placeholder
  timeout_seconds: 20.0

pipeline:
  version: 0.1.0
  telemetry_enabled: false
  event_queue_size: 100
  mode: auto
